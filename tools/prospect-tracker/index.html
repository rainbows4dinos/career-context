<body>
  <header id="nextchapter-header" data-app="tracker"></header>
  <div class="shell nc-content">
    <header id="tracker-heading">
      <div><h1>Prospect Tracker</h1><p>Your prospects, from first interest to a decision.</p></div>
    </header>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="login" class="panel narrow" hidden aria-labelledby="login-title">
      <h2 id="login-title">Sign in to Prospect Tracker</h2>
      <p class="muted">Use your existing account. Your prospects are private.</p>
      <form id="login-form">
        <div class="nc-field"><label class="nc-field__label" for="login-email">Email<span class="nc-field__required" aria-hidden="true">*</span></label><input class="nc-input" id="login-email" name="email" type="email" autocomplete="username" required></div>
        <div class="nc-field"><label class="nc-field__label" for="login-password">Password<span class="nc-field__required" aria-hidden="true">*</span></label><input class="nc-input" id="login-password" name="password" type="password" autocomplete="current-password" required></div>
        <p id="login-error" role="alert"></p>
        <button class="primary nc-button nc-button--primary nc-button--lg" type="submit">Sign in</button>
      </form>
    </section>
    <main id="workspace" tabindex="-1"><p>Connecting to Prospect Tracker…</p></main>
    <noscript><p>Prospect Tracker needs JavaScript to sign in and save prospects.</p></noscript>
  </div>
  <script type="module" src="bootstrap.js?v=20261014-status-sidebar"></script>
</body>
</html>
