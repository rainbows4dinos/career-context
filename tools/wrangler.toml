name = "resume-tailor-proxy"
main = "proxy-worker.js"
compatibility_date = "2024-01-01"

# Deploy with:
#   npx wrangler deploy
#
# Add your API key (one time):
#   npx wrangler secret put ANTHROPIC_API_KEY
#
# Then copy the deployed URL (e.g. https://resume-tailor-proxy.YOUR-NAME.workers.dev)
# and set it as PROXY_URL in resume-tailor.html
